services:
  searxng:
    image: docker.io/searxng/searxng:2026.9.15-ca4965040@sha256:f1aca3f61c7ff4552b8d54c0ab7fb458e907b78f51c503210cf450c900adca2c
    container_name: sovereign-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./core-config:/etc/searxng:rw
      - ./cache:/var/cache/searxng:rw
    environment:
      SEARXNG_BASE_URL: "http://127.0.0.1:8080/"
      SEARXNG_SECRET: "${SEARXNG_SECRET:-sovereign-local-development-change-me}"
